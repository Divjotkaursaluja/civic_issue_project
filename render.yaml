services:
  - type: web
    name: civic-issue-backend
    runtime: python
    plan: starter
    region: singapore
    buildCommand: bash build.sh
    preDeployCommand: python civicbackend/manage.py migrate
    startCommand: cd civicbackend && gunicorn civic_backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/complaints/counts/
    autoDeployTrigger: commit
    disk:
      name: civic-issue-media
      mountPath: /opt/render/project/src/civicbackend/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com
      - key: DJANGO_MEDIA_ROOT
        value: /opt/render/project/src/civicbackend/media
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: web
    name: civic-issue-frontend
    runtime: static
    buildCommand: cd civic_frontend && npm ci && npm run build
    staticPublishPath: civic_frontend/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
