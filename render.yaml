services:
  - type: web
    name: civic-issue-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: cd civicbackend && gunicorn civic_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180 --max-requests 1000 --max-requests-jitter 50
    healthCheckPath: /healthz/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com
      - key: DJANGO_MEDIA_ROOT
        value: /opt/render/project/src/civicbackend/media
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: web
    name: civic-issue-frontend
    runtime: static
    rootDir: civic_frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
